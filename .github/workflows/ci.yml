name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS matters: accepted-socket behaviour differs from Linux.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      # `vendor:curl` links the system libcurl. Linux needs the development
      # symlinks (and mbedtls, which Odin's binding names even when the system
      # curl uses OpenSSL); macOS links the SDK copy.
      - name: Install libcurl (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libmbedtls-dev

      - name: Standalone benchmark package
        run: bash micromeasure/check-standalone.sh

      - name: Unit and integration tests
        run: scripts/test.sh all

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: .cache/test-logs
          if-no-files-found: ignore

  sanitize:
    name: ThreadSanitizer (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libmbedtls-dev

      - name: Unit tests under ThreadSanitizer
        run: scripts/test.sh tsan

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-logs
          path: .cache/test-logs
          if-no-files-found: ignore
